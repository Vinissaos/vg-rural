# Não há workspaces; este arquivo existe para as configurações de segurança do pnpm.

# Bloqueia a instalação de versões publicadas há menos de 24 h (em minutos).
# Reduz o risco de pacotes comprometidos que são retirados logo após a publicação.
minimumReleaseAge: 1440

# pnpm 10 não executa scripts de instalação por padrão. Só os pacotes listados
# aqui podem executá-los; qualquer adição precisa de revisão.
onlyBuiltDependencies: []

# Correção de segurança (GHSA-g3hv-75wg-m249, minimatch < 11.0.1, só em ferramentas
# de desenvolvimento): o ESLint 9 e seus plugins ainda exigem minimatch 3.x/10.x e
# não há versão corrigida compatível publicada. O override força a versão
# corrigida. Remover quando eslint, typescript-eslint e os plugins aceitarem
# minimatch >= 11.0.1. Detalhes em docs/seguranca/vulnerabilidades-conhecidas.md.
overrides:
  minimatch: 11.0.3
